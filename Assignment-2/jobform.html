<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>

    <!-- External CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main heading -->
    <h1>Job Application Form</h1>

    <!-- Application Form -->
    <form>

        <!-- Personal Details -->
        <fieldset>
            <legend>Personal Details</legend>

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name">

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="example@gmail.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Min 6 characters"
                   required minlength="6">

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="10 digit mobile number"
                   required pattern="[0-9]{10}">

            <label for="website">Portfolio Website</label>
            <input type="url" id="website" name="website"
                   placeholder="https://yourwebsite.com">

            <label for="age">Age</label>
            <input type="number" id="age" name="age"
                   placeholder="Enter age" min="18" max="60" required>

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required>

            <label for="time">Preferred Interview Time</label>
            <input type="time" id="time" name="time">

            <label for="color">Favourite Color</label>
            <input type="color" id="color" name="color">

            <label for="address">Address</label>
            <textarea id="address" name="address"
                      placeholder="Enter your full address"
                      rows="3" required></textarea>
        </fieldset>

        <!-- Job Details -->
        <fieldset>
            <legend>Job Details</legend>

            <label>Gender</label>

            <input type="radio" id="male" name="gender" value="Male">
            <label for="male" class="option">Male</label><br>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female" class="option">Female</label>

            <label>Skills</label>

            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html" class="option">HTML</label><br>

            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css" class="option">CSS</label><br>

            <input type="checkbox" id="js" name="skills" value="JavaScript">
            <label for="js" class="option">JavaScript</label>

            <label for="city">City</label>
            <select id="city" name="city" required>
                <option value="">Select City</option>
                <option value="budaun">Budaun</option>
                <option value="bareilly">Bareilly</option>
                <option value="delhi">Delhi</option>
            </select>

            <label for="post">Position You Want</label>
            <input type="text" id="post" name="post"
                   list="posts" placeholder="Type or select">

            <datalist id="posts">
                <option value="Shop Assistant">
                <option value="Computer Operator">
                <option value="Sales Boy">
            </datalist>

            <label for="exp">Experience (Years): 0 to 10</label>
            <input type="range" id="exp" name="exp" min="0" max="10">

            <label for="resume">Upload Resume</label>
            <input type="file" id="resume" name="resume">

            <label for="why">Why do you want this job?</label>
            <textarea id="why" name="why"
                      placeholder="Write in 2-3 lines"
                      rows="3"></textarea>
        </fieldset>

        <!-- Form Buttons -->
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
