<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chai Adda - Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #fff5f8;
    color: #573344;
}

nav {
    background: #e75480;
    padding: 17px;
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: 600;
}

nav a:hover {
    color: #ffe1eb;
}

header {
    text-align: center;
    padding: 30px 15px;
}

header h1 {
    color: #d6336c;
    font-size: 32px;
}

header p {
    color: #805466;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.gallery img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 15px;
    border: 3px solid white;
    box-shadow: 0 4px 12px #e9b5c5;
    transition: 0.3s;
}

.gallery img:hover {
    transform: scale(1.04);
}

footer {
    background: #e75480;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 30px;
}

</style>
</head>

<body>

<nav>
    <a href="gallery.html">Gallery</a>
    <a href="product-grid.html">Products</a>
    <a href="dashboard.html">Dashboard</a>
</nav>

<header>
    <h1>🌸 Welcome to Chai Adda 🌸</h1>
    <p>Every Cup Has a Story!</p>
    <p>Enjoy our beautiful chai moments.</p>
</header>

<section class="gallery">

    <img src="https://images.unsplash.com/photo-1541167760496-1628856ab772?w=600" alt="Coffee cup">

    <img src="https://images.unsplash.com/photo-1561336313-0bd5e0b27ec8?w=600" alt="Tea cup">

    <img src="https://images.unsplash.com/photo-1571934811356-5cc061b6821f?w=600" alt="Chai">

    <img src="https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=600" alt="Tea">

    <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=600" alt="Hot drink">

    <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=600" alt="Coffee">

    <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=600" alt="Cafe">

    <img src="https://images.unsplash.com/photo-1447933601403-0c6688de566e?w=600" alt="Coffee beans">

    <img src="https://images.unsplash.com/photo-1521302080334-4bebac2763a6?w=600" alt="Cafe food">

</section>

<footer>
    <h3>Chai Adda ❤️</h3>
    <p>Created by Siya Sharma</p>

</html>
