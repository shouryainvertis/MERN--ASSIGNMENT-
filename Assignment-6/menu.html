<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chai Adda - Menu Bar</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
body { font-family: 'DM Sans', sans-serif; background: #FBF3E4; color: #12372A; margin: 0; }
nav { display: flex; justify-content: space-between; align-items: center; background: #12372A; padding: 14px 20px; }
.logo { font-family: 'Sora', sans-serif; color: white; font-size: 22px; font-weight: 700; }
.links { display: flex; gap: 20px; }
.links a { color: white; text-decoration: none; }
.links a:hover { color: #FF7A00; }
h1 { text-align: center; font-family: 'Sora', sans-serif; margin-top: 40px; }
p { text-align: center; }
</style>
</head>
<body>
<nav>
<div class="logo">Chai Adda</div>
<div class="links">
<a href="#">Home</a>
<a href="#">Menu</a>
<a href="#">Gallery</a>
<a href="#">Contact</a>
</div>
</nav>
<h1>Menu Bar using Flexbox</h1>
<p>Logo is on the left and links are on the right using display: flex.</p>
</body>
</html>
