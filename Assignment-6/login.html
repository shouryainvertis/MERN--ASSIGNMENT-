<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chai Adda - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
body { font-family: 'DM Sans', sans-serif; background: #FBF3E4; color: #12372A; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.login-box { background: white; padding: 30px; border-radius: 14px; width: 300px; text-align: center; border-top: 6px solid #FF7A00; }
h1 { font-family: 'Sora', sans-serif; font-size: 24px; }
input { width: 90%; padding: 10px; margin: 8px 0; border: 2px solid #12372A; border-radius: 8px; font-family: 'DM Sans', sans-serif; }
button { background: #FF7A00; color: white; border: none; padding: 10px 22px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 10px; }
button:hover { background: #12372A; }
</style>
</head>
<body>
<div class="login-box">
<h1>Welcome to Chai Adda</h1>
<p>Login to order your chai</p>
<form>
<input type="email" placeholder="Your Email"><br>
<input type="password" placeholder="Password"><br>
<button>Login</button>
</form>
<p>New here? Create account</p>
</div>
</body>
</html>
